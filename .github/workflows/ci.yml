name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Docker is preinstalled and usable out of the box on GitHub-hosted
      # ubuntu-latest runners, which is what backend/src/test's Testcontainers
      # (Postgres + WireMock) need — no docker-in-docker setup required.
      - name: Run tests
        working-directory: backend
        run: mvn -B test

      - name: Package
        working-directory: backend
        run: mvn -B package -DskipTests

  agent:
    name: Agent service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: agent-service
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: agent-service
        run: ruff check .

      - name: Test
        working-directory: agent-service
        env:
          # Never a real key: the test suite mocks every OpenAI call
          # (see tests/test_classify.py, test_retrieval.py) and never makes
          # a real network request. Only present so module-level client
          # construction (`OpenAI(api_key=...)`) doesn't fail on import.
          OPENAI_API_KEY: test-key-not-real
        run: pytest tests/ -v

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config

      - name: Build backend, agent-service, and frontend images
        run: docker compose build backend agent-service frontend

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile/compose misconfiguration scan. Blocking on CRITICAL only:
      # base-image and config issues at that severity are worth failing a
      # build over; lower severities are surfaced in the Security tab
      # instead of gating every PR.
      - name: Dockerfile config scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: 1

      # Dependency vulnerability scan across pom.xml / requirements*.txt /
      # package-lock.json. Report-only (exit-code 0): transitive-dependency
      # CVEs are extremely common noise in JS/Python ecosystems and aren't
      # something a demo project should gate every PR on — this surfaces
      # findings in the Security tab for review instead.
      - name: Dependency scan (Trivy, report-only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
