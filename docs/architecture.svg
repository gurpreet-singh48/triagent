<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>

  <text x="600" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Triagent — Architecture</text>
  <text x="600" y="47" text-anchor="middle" font-size="12" fill="#6b7280">Webhook &#8594; idempotency &#8594; agentic triage (LangGraph + Qdrant) &#8594; ticket, with RAG chat and observability</text>

  <!-- ================= connectors (lines + arrowheads only; labels are drawn last, on top of boxes) ================= -->

  <line x1="260" y1="175" x2="318" y2="175" stroke="#6b7280" stroke-width="2"/>
  <polygon points="320,175 311,170 311,180" fill="#6b7280"/>

  <line x1="262" y1="420" x2="318" y2="420" stroke="#6b7280" stroke-width="2"/>
  <polygon points="320,420 311,415 311,425" fill="#6b7280"/>
  <polygon points="260,420 269,415 269,425" fill="#6b7280"/>

  <line x1="622" y1="180" x2="678" y2="180" stroke="#6b7280" stroke-width="2"/>
  <polygon points="680,180 671,175 671,185" fill="#6b7280"/>

  <line x1="678" y1="235" x2="622" y2="235" stroke="#6b7280" stroke-width="2"/>
  <polygon points="620,235 629,230 629,240" fill="#6b7280"/>

  <line x1="390" y1="460" x2="390" y2="488" stroke="#6b7280" stroke-width="2"/>
