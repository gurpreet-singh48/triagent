  <polygon points="710,375 701,370 701,380" fill="#6b7280"/>

  <line x1="810" y1="290" x2="810" y2="338" stroke="#6b7280" stroke-width="2"/>
  <polygon points="810,340 805,331 815,331" fill="#6b7280"/>

  <path d="M470,140 L470,100 L1110,100 L1110,138" fill="none" stroke="#6b7280" stroke-width="2"/>
  <polygon points="1110,140 1105,131 1115,131" fill="#6b7280"/>

  <path d="M840,140 L840,117 L1080,117 L1080,138" fill="none" stroke="#6b7280" stroke-width="2"/>
