global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: triagent-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: triagent-agent-service
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-service:8000"]
